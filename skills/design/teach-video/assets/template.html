<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>__TITEL__</title>
<!-- Vorlage für ein Lernvideo. Kopie liegt in videos/src/NNNN-name/ neben words.js, kit.js und voice.mp3.
     Farben und Schriften: aus assets/course.css des Kurses übernehmen, falls vorhanden (gleicher Look wie die Lektionen).
     Jede Szene ist eine Funktion von t. Zeiten kommen aus Kit.at('wort'), nie aus geratenen Sekunden. -->
<style>
  :root {
    --paper: #fbf9f4; --ink: #1f1d1a; --muted: #6b665e; --rule: #ddd6c8; --panel: #f3efe6;
    --accent: #9a3324; --ok: #2f6b3a; --ok-bg: #e3efe2; --bad: #a3291f; --bad-bg: #f6e1dd;
    --skip: #66615a; --skip-bg: #ebe7de; --code-bg: #f0ebe0;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { margin: 0; background: var(--paper); overflow: hidden; }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper);
           color: var(--ink); font-family: var(--serif); }
  /* ruhig bewegter Hintergrund: Linienraster, das langsam driftet */
  .grid { position: absolute; inset: -200px; background-image:
          linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
          background-size: 96px 96px; opacity: 0.35; }
  .scene { position: absolute; inset: 0; padding: 120px 160px; visibility: hidden; }
  .kicker { font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 0 0 24px; }
  h1 { font-weight: 400; font-size: 96px; line-height: 1.1; margin: 0; max-width: 1400px; }
  .term { position: absolute; left: 160px; bottom: 110px; font-family: var(--mono); font-size: 44px;
          background: var(--code-bg); border-left: 6px solid var(--accent); padding: 14px 28px; visibility: hidden; }
  pre { font-family: var(--mono); font-size: 34px; line-height: 1.55; background: var(--code-bg);
        padding: 40px 48px; border-radius: 10px; margin: 0; white-space: pre; }
  .line { display: block; transition: none; }
  .line.hl { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .question { font-size: 64px; line-height: 1.25; max-width: 1500px; }
  .pause { margin-top: 48px; font-size: 32px; color: var(--muted); }
  .bar { height: 8px; background: var(--rule); border-radius: 4px; margin-top: 20px; width: 900px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
  .source { font-size: 34px; color: var(--muted); margin-top: 40px; }
  .source b { color: var(--ink); font-weight: 400; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid" id="grid"></div>

  <section class="scene" id="s-frage">
    <p class="kicker">__KURS__ · Video __NR__</p>
    <h1 id="frage">__EINSTIEGSFRAGE__</h1>
  </section>

  <!-- weitere Szenen hier: Code, Diagramme, Zustände. Eine visuelle Idee pro Szene. -->

  <section class="scene" id="s-quiz">
    <p class="kicker">Pause drücken und antworten</p>
    <p class="question" id="quiz-frage">__ABRUFFRAGE__</p>
    <div class="bar"><i id="quiz-bar"></i></div>
    <p class="question" id="quiz-antwort" style="color: var(--ok)">__ANTWORT__</p>
  </section>

  <section class="scene" id="s-ende">
    <p class="kicker">Weiterlesen</p>
    <h1>__KERNSATZ__</h1>
    <p class="source">Primärquelle: <b>__QUELLE__</b></p>
  </section>

  <div class="term" id="term"></div>
</div>

<script src="words.js"></script>
<script src="kit.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  // Gesamtdauer: Stimme + 2 s Ausklang
  var DUR = Kit.words.voiceAt + Kit.words.voiceDuration + 2;
  Kit.video({ duration: DUR, stills: { check: [0.5, 3, DUR - 1] } });

  Kit.scene(function (t) {            // Hintergrund driftet immer
    $('grid').style.transform = 'translate(' + (-t * 6) + 'px,' + (-t * 3) + 'px)';
  });

  Kit.scene(function (t) {            // Einstieg: die Frage, worum es geht
    Kit.fade($('s-frage'), t, 0.2, Kit.at('__ERSTES_WORT_DER_NÄCHSTEN_SZENE__') - 0.3);
  });

  // Fachbegriff einblenden, genau wenn er fällt:
  // Kit.scene(function (t) { $('term').textContent = 'runs-on'; Kit.fade($('term'), t, Kit.at('runs-on'), Kit.end('runs-on') + 1.5, { y: 12 }); });

  Kit.scene(function (t) {            // Abruffrage mit Denkpause, dann Antwort
    var q = Kit.at('__ERSTES_WORT_DER_FRAGE__'), a = Kit.at('__ERSTES_WORT_DER_ANTWORT__');
    Kit.fade($('s-quiz'), t, q - 0.2, Kit.at('__ERSTES_WORT_DES_ENDES__') - 0.3);
    $('quiz-bar').style.width = (Kit.p(t, Kit.end('__LETZTES_WORT_DER_FRAGE__'), a - Kit.end('__LETZTES_WORT_DER_FRAGE__'), Kit.lin) * 100) + '%';
    Kit.fade($('quiz-antwort'), t, a);
  });

  Kit.scene(function (t) {            // Abschlusstafel mit Primärquelle
    Kit.fade($('s-ende'), t, Kit.at('__ERSTES_WORT_DES_ENDES__') - 0.2);
  });
</script>
</body>
</html>
